# CI : setiap push & pull request -> lint + build (gagal = merah di GitHub).
# CD : ditangani Vercel Git Integration (repo sudah tersambung ke project "ibrahim-azzam"):
#      push ke main  -> deploy Production  (https://ibrahim-azzam.vercel.app)
#      pull request  -> deploy Preview (link otomatis dikomentari Vercel di PR)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
